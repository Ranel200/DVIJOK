[project]
name = "komit-crm"
version = "0.1.0"
description = "КОМИТ — backend Admin CRM-ядра автосервиса (FastAPI + SQLAlchemy 2.0 async)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "redis>=5.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# UP042: (str, Enum) оставляем намеренно — стабильная сериализация и совместимость.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-идиома: вызовы в значениях по умолчанию (Depends/Query) — это норма.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.security.OAuth2PasswordRequestForm",
]

[tool.ruff.lint.per-file-ignores]
# Историческая autogenerate-миграция остаётся byte-for-byte стабильной; новые
# forward migrations проходят обычные правила Ruff.
"alembic/versions/ca9578f833fe_initial.py" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
