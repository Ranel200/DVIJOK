server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dvizhok.tech;

    root /var/www/dvizhok;
    client_max_body_size 3m;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /client {
        return 301 /client/;
    }

    location /client/ {
        try_files $uri $uri/ /client/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(admin|client)/assets/.+\.(?:css|js|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* ^/assets/.+\.(?:css|js|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not preserve a client-supplied X-Forwarded-For chain. Uvicorn
        # trusts this header because the API is reachable only through Nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
